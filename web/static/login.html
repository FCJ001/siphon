<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siphon · 登录</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23C8102E%22/%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2254%25%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%20font-size%3D%2240%22%20font-family%3D%22PingFang%20SC%22%20font-weight%3D%22600%22%20fill%3D%22%23FBF9F3%22%3E%E8%99%B9%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* 静默 */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=20260913a">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form">
    <span class="brand-mark" style="width:38px;height:38px;font-size:21px">虹</span>
    <h1>Siphon 中转台</h1>
    <div class="eyebrow" style="margin:2px 0 16px">Siphon relay · <span class="zh">账号池 · 省 token 中转</span></div>
    <label class="f">管理密码
      <input id="pw" type="password" autofocus autocomplete="current-password"></label>
    <div class="err" id="err"></div>
    <button class="btn primary" style="width:100%;padding:9px" type="submit">进入</button>
  </form>
</div>
<script>
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await API.login(document.getElementById("pw").value);
  if (r.code === 0) {
    localStorage.setItem("siphon_token", r.data.token);
    location.href = "/";
  } else {
    document.getElementById("err").textContent = r.message || "登录失败";
  }
});
</script>
<script src="/static/app-1-core.js?v=20260913b"></script>
</body>
</html>
